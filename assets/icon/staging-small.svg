<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Staging and dev builds at 16 to 48px. Dashes turn to noise this small, so the light
       tile alone tells it apart from the released app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e2e0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="210" fill="url(#bg)"/>
  <rect x="20" y="20" width="984" height="984" rx="190" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="40"/>
  <g fill="none" stroke="#0a0a0b" stroke-width="112">
    <circle cx="392" cy="512" r="222"/>
    <circle cx="632" cy="512" r="222"/>
  </g>
</svg>
