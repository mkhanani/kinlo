<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Staging and dev builds: a light tile with dashed rings, so they are never mistaken
       for the released app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e2e0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <rect x="67" y="67" width="890" height="890" rx="201" fill="none" stroke="#000000" stroke-opacity="0.16" stroke-width="6"/>
  <g fill="none" stroke="#0a0a0b" stroke-width="66" stroke-dasharray="84 40">
    <circle cx="414" cy="512" r="178"/>
    <circle cx="610" cy="512" r="178"/>
  </g>
</svg>
