[package]
name = "kinlo"
version = "0.1.1"
description = "Local-first personal CRM for desktop"
authors = ["kinlo contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kinlo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
# macos-private-api enables the transparent window that vibrancy needs. It is a no-op on other systems.
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-os = "2.4.0"
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
# Lets the web view call the AI provider the user chose, without the browser's cross-origin limits.
tauri-plugin-http = "2.9.0"
# API keys go in the operating system's keychain. Nowhere else.
keyring = "4.2.0"
# The system's own "Save as" and "Open" dialogs, for export and import.
tauri-plugin-dialog = "2.8.4"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["rt", "macros"] }
